<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Geist:wght@500..800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#1c1b19" />
    <script>
      let appearance = 'system'
      try { appearance = JSON.parse(localStorage.getItem('cc.settings') || '{}').appearance || 'system' } catch { /* Use System. */ }
      document.documentElement.dataset.theme = appearance === 'dark' || appearance === 'light'
        ? appearance : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    </script>
    <title>elo101 · Analytics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>

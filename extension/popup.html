<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elo101 Game Review</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <img class="brand-mark" src="icons/icon-48.png" alt="" width="38" height="38" />
        <div class="brand-copy">
          <p class="eyebrow">ELO101 <span>·</span> CHESS REVIEW</p>
          <h1>Review a game</h1>
        </div>
      </header>

      <section class="page-check" aria-label="Current page status">
        <div class="section-label"><span class="status-dot" aria-hidden="true"></span> CURRENT PAGE</div>
        <p id="message" class="message" role="status" aria-live="polite">Checking this page…</p>
      </section>

      <button id="review" type="button" disabled>
        <span>Review game</span><span class="button-arrow" aria-hidden="true">↗</span>
      </button>

      <footer class="footer">
        <span>Chess.com · Lichess</span>
        <a href="https://elo101.vercel.app/privacy.html" target="_blank" rel="noopener noreferrer">Privacy</a>
      </footer>
    </main>
    <script src="game-link.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elo101 Game Review</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="mark" aria-hidden="true">♞</div>
        <div>
          <p class="eyebrow">ELO101</p>
          <h1>Game review</h1>
        </div>
      </div>
      <p id="message" class="message" role="status" aria-live="polite">Checking this page…</p>
      <button id="review" type="button" disabled>Review game <span aria-hidden="true">↗</span></button>
      <p class="hint">Opens elo101 with this game link and, on Chess.com, a player name if found. Analysis runs in your browser. <a href="https://elo101.vercel.app/privacy.html" target="_blank" rel="noopener noreferrer">Privacy</a></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
